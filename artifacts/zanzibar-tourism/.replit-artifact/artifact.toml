kind = "web"
previewPath = "/"
title = "Zanzibar Tourism"
version = "1.0.0"
id = "artifacts/zanzibar-tourism"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20205

[services.development]
run = "pnpm --filter @workspace/zanzibar-tourism run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zanzibar-tourism", "run", "build" ]
publicDir = "artifacts/zanzibar-tourism/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20205"
BASE_PATH = "/"
